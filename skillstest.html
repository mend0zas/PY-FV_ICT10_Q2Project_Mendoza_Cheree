<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonmetal Exploration</title>

    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #fff8dc, #f2d58a);
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, sans-serif;
            color: #493813;
        }

        nav {
            background: #fff9e8;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 1px solid #dfc477;
        }

        nav a {
            text-decoration: none;
            color: #75551b;
            margin: 0 8px;
        }

        nav a:hover, nav a.active {
            color: #c17b00;
            font-weight: bold;
        }

        .brand {
            font-weight: bold;
            letter-spacing: 1px;
            color: #946000;
        }

        .container {
            width: min(650px, 90%);
            margin: 45px auto;
            padding: 35px;
            background: #fffdf3;
            border: 1px solid #e5cf8c;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 20px #8c6b2420;
        }

        h1 {
            color: #bd7900;
        }

        h2 {
            color: #a66d00;
        }

        p {
            line-height: 1.6;
        }

        input {
            width: 100%;
            max-width: 380px;
            padding: 13px;
            margin: 10px auto;
            border: 1px solid #c8ad65;
            border-radius: 10px;
            background: #fffaf0;
            font: inherit;
        }

        input:focus {
            outline: none;
            border: 2px solid #d69e2e;
        }

        button {
            width: 100%;
            max-width: 380px;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: #e5a51e;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font: inherit;
        }

        button:hover {
            background: #c8870b;
        }

        .result {
            text-align: left;
            margin-top: 25px;
            padding: 20px;
            background: #fff5d5;
            border-radius: 12px;
            border-left: 5px solid #d99b17;
        }

        .result p {
            padding: 8px;
            border-bottom: 1px solid #ead9a7;
        }

        .result span {
            color: #a66d00;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #806c42;
        }

        @media (max-width: 650px) {
            nav {
                justify-content: center;
            }

            nav div {
                text-align: center;
            }

            .container {
                padding: 25px 18px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a class="brand" href="index.html">MY Q2 PORTFOLIO</a>

        <div>
            <a href="index.html">Home</a>
            <a class="active" href="skillstest.html">Element Checker</a>
            <a href="drill2.html">Club Members</a>
            <a href="creator.html">Meet the Creator</a>
        </div>
    </nav>

    <div class="container">

        <h1>Nonmetal Exploration! ⚡</h1>
        <p>Explore some cool nonmetals!</p>

        <input type="text" id="nonmetal1" placeholder="Enter a symbol (Example: He)">

        <br>

        <button type="button" py-click="search_nonmetal">
            Search Nonmetal!
        </button>

        <div class="result">

            <h2>Element Information</h2>

            <p><b>Name:</b> <span id="name">—</span></p>
            <p><b>Symbol:</b> <span id="symbol">—</span></p>
            <p><b>Atomic Number:</b> <span id="number">—</span></p>
            <p><b>Atomic Mass:</b> <span id="mass">—</span></p>

        </div>

    </div>

    <footer>Skills Test • Nonmetal Exploration</footer>

    <script type="py" src="elements.py"></script>

</body>
</html>
